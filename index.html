<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundRoom</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <aside class="sidebar">
    <h2>SoundRoom</h2>

    <nav>
      <a href="#">Home</a>
      <a href="#">Library</a>
      <a href="#">Playlists</a>
      <a href="#">Favorites</a>
    </nav>
  </aside>

  <main class="main">

    <section class="hero">
      <h1>Discover Music</h1>
      <p>Listen to your favorite tracks in one place.</p>
    </section>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search for a song...">
      <span>🔍</span>
    </div>

    <section class="grid" id="songList">

      <div class="card" data-title="jade lemac constellations"
        onclick="selectSong('y13-xeaShIo','Jade LeMac - Constellations')">

        <h3>Jade LeMac - Constellations</h3>



        <div class="video">
          <iframe
            id="activeFrame"
            src="https://www.youtube.com/embed/y13-xeaShIo?enablejsapi=1&rel=0"
            frameborder="0"
            allow="autoplay; encrypted-media"
            allowfullscreen>
          </iframe>
        </div>
      </div>



      <div class="card" data-title="new song don toliver" onclick="selectSong('7GwLnsVUwHY','Don Toliver - E85')">

        <h3>Don Toliver - E85</h3>

        <div class="video">
          <iframe
            src="https://www.youtube.com/embed/7GwLnsVUwHY?enablejsapi=1&rel=0"
            frameborder="0"
            allow="autoplay; encrypted-media"
            allowfullscreen>
          </iframe>
        </div>
      </div>


         <!-- SONG 3 -->
<div class="card" data-title="third song name here">
  <h3>Third Song Name</h3>

  <div class="video">
    <div
      class="youtube-player"
      id="player3"
      data-video-id="SOJpE1KMUbo"
      data-title="Third Song Name">
    </div>
  </div>
</div>

    </section>

    <p class="no-results" id="noResults">No songs found.</p>

  </main>

  <footer class="player" id="player">
    <div class="player-left">
      <img id="songImg">

      <div class="song-info">
        <h4 id="songTitle"></h4>
        <p id="status">Paused</p>
      </div>
    </div>

    <button id="playBtn">▶</button>
  </footer>

</div>

<script src="script.js"></script>
</body>
</html>
