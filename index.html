<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoundRoom</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <aside class="sidebar">
    <h2>SoundRoom</h2>

    <nav>
      <a href="#">Home</a>
      <a href="#">Library</a>
      <a href="#">Playlists</a>
      <a href="#">Favorites</a>
    </nav>
  </aside>

  <main class="main">

    <section class="hero">
      <h1>Discover Music</h1>
      <p>Listen to your favorite tracks in one place.</p>
    </section>

    <div class="card">
      <h3>Jade LeMac - Constellations</h3>

      <div class="video">
        <iframe
          id="youtube-player"
          src="https://www.youtube.com/embed/y13-xeaShIo?enablejsapi=1&rel=0"
          title="YouTube player"
          frameborder="0"
          allow="autoplay; encrypted-media"
          allowfullscreen>
        </iframe>
      </div>
    </div>

  </main>

  <!-- EMPTY BOTTOM PLAYER FIRST -->

  <footer class="player empty" id="player">

    <div class="player-left">
      <img src="https://img.youtube.com/vi/y13-xeaShIo/hqdefault.jpg">

      <div class="song-info">
        <h4>Jade LeMac - Constellations</h4>
        <p id="status">Now Playing</p>
      </div>
    </div>

    <button id="playBtn">⏸</button>

  </footer>

</div>

<script src="https://www.youtube.com/iframe_api"></script>

<script src="script.js"></script>

</body>
</html>
