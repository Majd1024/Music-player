<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundRoom</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>SoundRoom</h2>

    <nav>
      <a href="#">Home</a>
      <a href="#">Library</a>
      <a href="#">Playlists</a>
      <a href="#">Favorites</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <section class="hero">
      <h1>Discover Music</h1>
      <p>Listen to your favorite tracks in one place.</p>
    </section>

    <!-- GRID WRAPPER -->
    <section class="grid">

      <!-- SONG 1 -->
      <div class="card" onclick="selectSong('y13-xeaShIo','Jade LeMac - Constellations')">

        <div class="card-row">

          <div class="text">
            <h3>Jade LeMac - Constellations</h3>
          </div>

          <div class="video">
            <iframe
              src="https://www.youtube.com/embed/y13-xeaShIo?rel=0"
              frameborder="0"
              allowfullscreen>
            </iframe>
          </div>

        </div>

      </div>

      <!-- SONG 2 -->
      <div class="card" onclick="selectSong('7GwLnsVUwHY','New Song')">

        <div class="card-row">

          <div class="text">
            <h3>New Song</h3>
          </div>

          <div class="video">
            <iframe
              src="https://www.youtube.com/embed/7GwLnsVUwHY?rel=0"
              frameborder="0"
              allowfullscreen>
            </iframe>
          </div>

        </div>

      </div>

    </section>

  </main>

  <!-- PLAYER -->
  <footer class="player" id="player">

    <div class="player-left">
      <img id="songImg">

      <div class="song-info">
        <h4 id="songTitle"></h4>
        <p id="status">Paused</p>
      </div>
    </div>

    <button id="playBtn">▶</button>

  </footer>

</div>

<script src="script.js"></script>

</body>
</html>
