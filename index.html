<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundRoom</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2>SoundRoom</h2>

    <nav>
      <a href="#">Home</a>
      <a href="#">Library</a>
      <a href="#">Playlists</a>
      <a href="#">Favorites</a>
    </nav>
  </aside>

  <!-- MAIN -->
  <main class="main">

    <section class="hero">
      <h1>Discover Music</h1>
      <p>Listen to your favorite tracks in one place.</p>
    </section>

    <section class="grid">

      <!-- SONG 1 -->
      <div class="card"
           onclick="selectSong('y13-xeaShIo','Jade LeMac - Constellations')">

        <h3>Jade LeMac - Constellations</h3>

        <div class="video">
          <iframe
            src="https://www.youtube.com/embed/y13-xeaShIo?rel=0"
            frameborder="0"
            allowfullscreen>
          </iframe>
        </div>
      </div>

      <!-- SONG 2 -->
      <div class="card"
           onclick="selectSong('VIDEO_ID_HERE','Song Name Here')">

        <h3>Song Name Here</h3>

        <div class="video">
          <iframe
            src="https://www.youtube.com/embed/VIDEO_ID_HERE?rel=0"
            frameborder="0"
            allowfullscreen>
          </iframe>
        </div>
      </div>

      <!-- ADD MORE LIKE THIS -->

    </section>

  </main>

  <!-- BOTTOM PLAYER -->
  <footer class="player" id="player">

    <div class="player-left">
      <img id="songImg">

      <div class="song-info">
        <h4 id="songTitle"></h4>
        <p id="status">Paused</p>
      </div>
    </div>

    <button id="playBtn">▶</button>

  </footer>

</div>

<script src="script.js"></script>

</body>
</html>
